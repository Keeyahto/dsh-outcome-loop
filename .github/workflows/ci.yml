name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke
      - run: pnpm pack
      - name: verify tarball contents
        run: |
          mkdir -p /tmp/pack && tar -xzf dsh-outcome-loop-*.tgz -C /tmp/pack
          test -f /tmp/pack/package/lib/index.js
          test -f /tmp/pack/package/cordis.patch.yml
          test -f /tmp/pack/package/README.md
          test -f /tmp/pack/package/LICENSE
          # Resolve the packed entry against the repo's own dependency tree
          # (the plugin always runs inside a DSH profile where peers exist).
          ln -s "$PWD/node_modules" /tmp/pack/package/node_modules
          # DSH loads plugins via named exports (or the default object):
          # every row must expose name + apply.
          node -e "import('/tmp/pack/package/lib/index.js').then(m => { const p = m.default ?? m; if (p.name !== 'outcome-loop' || typeof p.apply !== 'function') process.exit(1) })"
          node -e "import('/tmp/pack/package/lib/consumers/commands.js').then(m => { const p = m.default ?? m; if (p.name !== 'outcome-loop-commands' || typeof p.apply !== 'function') process.exit(1) })"
          node -e "import('/tmp/pack/package/lib/consumers/projection.js').then(m => { const p = m.default ?? m; if (p.name !== 'outcome-loop-projection' || typeof p.apply !== 'function') process.exit(1) })"
          node -e "import('/tmp/pack/package/lib/consumers/contribute.js').then(m => { const p = m.default ?? m; if (p.name !== 'outcome-loop-contribute' || typeof p.apply !== 'function') process.exit(1) })"
