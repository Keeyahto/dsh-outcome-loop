name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c448adde6a # v4.2.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke
      - run: pnpm pack
      - name: verify tarball contents
        run: |
          mkdir -p /tmp/pack && tar -xzf dsh-outcome-loop-*.tgz -C /tmp/pack
          test -f /tmp/pack/package/lib/index.js
          test -f /tmp/pack/package/cordis.patch.yml
          test -f /tmp/pack/package/README.md
          test -f /tmp/pack/package/LICENSE
          node -e "import('/tmp/pack/package/lib/index.js').then(m => { if (m.default.name !== 'outcome-loop') process.exit(1) })"
